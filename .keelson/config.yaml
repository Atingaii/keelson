# Keelson project configuration. Every key is optional; defaults are shown.
# paths.specs: where behaviour contracts live. refs.*: existing project material, referenced, never copied.
# Docs: https://github.com/Atingaii/keelson/blob/main/docs/configuration.md
version: 2
tools:
  - claude
lang: en
profile: lean
default_tier: auto
confirm:
  quick: proceed
  spec: wait
land: fold
check:
  - npm run lint
  - npm run test
context: ""
paths:
  specs: .keelson/specs
refs:
  architecture: docs/how-it-works.md
  decisions: null
  tasks: https://github.com/Atingaii/keelson/issues
  ci: .github/workflows
models: {}
effort:
  review_min: standard
  plan_min: deep
  verify_min: deep
  escalate_after: 2
