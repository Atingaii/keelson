# Keelson project configuration. Every key is optional; defaults are shown.
# paths.specs: where behaviour contracts live. refs.*: existing project material, referenced, never copied.
# check: commands (strings, or {name, command, kind}) that prove the code works. guide: true when the owner is learning engineering.
# budgets: soft line budgets per document type; durable truth hard-fails at 2x, while temporary change/handoff files only warn.
# Docs: https://github.com/Atingaii/keelson/blob/main/docs/configuration.md
version: 4
tools:
  - claude
lang: en
profile: lean
default_tier: auto
confirm:
  quick: proceed
  spec: wait
land: fold
check:
  - npm run lint
  - npm run test
guide: false
hooks: true
budgets:
  INTENT: 120
  ROADMAP: 80
  NOW: 60
  GLOSSARY: 200
  spec: 250
  rule: 120
  change: 200
  handoff: 100
  always-on: 300
context: ""
paths:
  specs: .keelson/specs
refs:
  architecture: docs/how-it-works.md
  decisions: null
  tasks: https://github.com/Atingaii/keelson/issues
  ci: .github/workflows
models: {}
effort:
  review_min: standard
  plan_min: deep
  verify_min: deep
  escalate_after: 2
